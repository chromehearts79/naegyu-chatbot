name: 새 판 만들기
on:
  push:
    branches: [main]
    paths-ignore:
      - '대기/**'
      - 'reports/alio_watch/**'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
env:
  PYTHONUTF8: "1"
  GH_TOKEN: ${{ github.token }}
  NAEGYU_ASSIGNEES: ${{ vars.NAEGYU_ASSIGNEES }}
jobs:
  release:
    if: github.event.repository.fork != true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: naegyu-write
      cancel-in-progress: false
      queue: max
    steps:
      # 이 실행이 시험하는 커밋(GITHUB_SHA)이 곧 새 판이 되는 커밋이다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: setup
        timeout-minutes: 20
        uses: ./.github/actions/setup
      - id: checks
        timeout-minutes: 20
        uses: ./.github/actions/checks
      # 새 판을 먼저 올린다. 번호·설명·대상 커밋은 모두 GITHUB_SHA 에서 읽는다.
      - id: publish
        name: 새 판 올리기
        timeout-minutes: 20
        run: python3 -X utf8 scripts/release_ci.py publish
      # 여기부터는 기록 작업이다. 실패해도 새 판은 막지 않고, 다음 주 확인이 스스로 맞춘다.
      - id: sync
        name: 최신 main 으로 맞추기
        continue-on-error: true
        run: |
          git restore .
          git pull --rebase origin main
      - id: refresh
        name: ALIO 기록 갱신
        continue-on-error: true
        timeout-minutes: 20
        run: python3 -X utf8 scripts/alio_release.py refresh
      - id: weekly
        name: ALIO 판정(댓글 없이)
        continue-on-error: true
        timeout-minutes: 20
        run: python3 -X utf8 scripts/watch_ci.py --no-weekly
      - id: commit
        continue-on-error: true
        uses: ./.github/actions/commit
        with:
          paths: |
            knowledge/alio_seen.json
            대기
            reports/alio_watch
          message: ALIO 기록 갱신
      - name: 기록 작업 실패 표시
        if: always() && (steps.sync.outcome == 'failure' || steps.refresh.outcome == 'failure' || steps.weekly.outcome == 'failure' || steps.commit.outcome == 'failure')
        run: echo "::warning::ALIO 기록 작업이 일부 실패했습니다. 새 판에는 영향이 없고, 다음 주 확인이 스스로 다시 맞춥니다."
      - name: 새 판 실패나 시간 초과를 알리기
        if: failure() || cancelled()
        run: python3 -X utf8 scripts/watch_ci.py --report-failure "새 판 만들기가 끝까지 되지 않았습니다(실패 또는 시간 초과). Actions 탭에서 실패한 실행의 빨간 단계를 확인하세요." --kind release
